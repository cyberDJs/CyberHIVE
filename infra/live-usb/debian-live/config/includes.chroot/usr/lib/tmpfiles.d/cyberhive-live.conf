# CyberHIVE Live USB volatile runtime directories.
# These directories are runtime state only. They are not persistent evidence
# unless an explicit persistent overlay policy later maps them elsewhere.

d /run/cyberhive 0755 root root -
d /run/cyberhive/evidence 0755 root root -
d /run/cyberhive/cache 0755 root root -
d /run/cyberhive/state 0755 root root -
