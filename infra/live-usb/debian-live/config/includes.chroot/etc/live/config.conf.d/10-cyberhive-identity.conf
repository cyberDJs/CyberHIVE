# CyberHIVE immutable live identity defaults.
# live-config reads /etc/live/config.conf.d/*.conf before kernel parameters.
# Kernel username=/hostname= may override these values, but a stale EFI/GRUB
# must never fall back to Debian's generic user/debian identity.
LIVE_USERNAME="cyberhive"
LIVE_HOSTNAME="cyberhive-live"
